<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - PureHeal Hospital</title>
  <link rel="icon" href="../../Assets/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="./login.css">
</head>
<body>
  <div class="container">
    <div class="login_card">
      <h2>Login to Your Account</h2>
      <p>Access appointments, reports & health records</p>

      <form id="loginForm" method="post">
          <input class="FormInput" id="loginEmailInput" type="email" placeholder="Email Address" required />
          <input class="FormInput" id="loginPasswordInput" type="password" placeholder="Password" required />
          <p class="Error_P" id="Error_P"></p>
        <button type="submit" class="login_btn" id="login_btn">
          <i class="fas fa-sign-in-alt"></i> Login Securely
        </button>
      </form>
      
      <div class="signup">
        New here? <a href="../SignUp/SignUp.html">Create Free Account →</a>
      </div>
    </div>
  </div>

  <!-- Modals -->
   <div class="modal fade" id="fielderrorModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-sm">
        <div class="modal-content p-3 text-center">
          <p>Fill the fields correctly!</p>
        </div>
      </div>
    </div>

    <div class="modal fade" id="passworderrorModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-sm">
            <div class="modal-content p-3 text-center">
                <p>Password must be at least 6 characters!</p>
            </div>
        </div>
    </div>

</body>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.min.js" integrity="sha384-VQqxDN0EQCkWoxt/0vsQvZswzTHUVOImccYmSyhJTp7kGtPed0Qcx8rK9h9YEgx+" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./login.js"></script>
</html>
