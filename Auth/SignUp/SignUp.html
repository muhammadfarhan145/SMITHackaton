<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | PureHeal</title>
    <link rel="icon" href="../../Assets/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="./SignUp.css">
</head>
<body>
    <div class="container">
        <div class="signup_card">
            <h2>Create Free Account</h2>
            <p class="subtitle">Join 100K+ patients. Takes only 30 seconds!</p>

            <form id="signupForm" method="post">
                <input class="FormInput" type="text" id="name" placeholder="Full Name" required />
                <input class="FormInput" type="email" id="email" placeholder="Email Address" required />
                <input class="FormInput" type="password" id="password" placeholder="Create Password" required />
                <button type="submit" class="signup_btn" id="signUpButton">
                    <i class="fas fa-user-plus"></i> Sign Up Free
                </button>
            </form>
            <div class="login_link">
                Already have account? <a href="../login/login.html">Login Here →</a>
            </div>
        </div>
    </div>

  <!-- MODALS-->
    <div class="modal fade" id="fielderrorModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-sm">
        <div class="modal-content p-4 text-center">
            <p>Please fill all fields correctly!</p>
        </div>
        </div>
    </div>

    <div class="modal fade" id="passworderrorModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-sm">
            <div class="modal-content p-4 text-center">
                <p>Password must be 6+ characters!</p>
            </div>
        </div>
    </div>
</body>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.min.js" integrity="sha384-VQqxDN0EQCkWoxt/0vsQvZswzTHUVOImccYmSyhJTp7kGtPed0Qcx8rK9h9YEgx+" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./SignUp.js"></script>
</html>
